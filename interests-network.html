<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red de Áreas de Interés</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root{
    --bg: transparent;
    --ink: #23262B;

    --c1: #B2C3A0; /* Computational Social Sciences - Lush Meadow */
    --c2: #C3CBCA; /* Social Network Analysis - Cloudy Blue */
    --c3: #CF8D72; /* Economic Sociology - Fruit Juice */
    --c4: #D8AF95; /* Cultural Sociology - Peach Blush */
    --c5: #DFCA99; /* Sociology of Elites - Light Gold */
    --c6: #495D6D; /* Social & Cultural Theory - Summer Night */
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }

  #wrap {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    gap: 14px;
  }

  #chart-area {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
  }

  svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .link {
    stroke: #B9B9B9;
    stroke-width: 1.4px;
    stroke-linecap: round;
    opacity: 0.75;
    transition: stroke 0.6s ease, opacity 0.6s ease;
  }

  .link.to-center {
    stroke: #6E6E6E;
    stroke-width: 2px;
    opacity: 0.95;
  }

  .node-group { cursor: grab; }
  .node-group:active { cursor: grabbing; }

  .node-halo {
    fill: none;
    stroke-width: 10px;
    opacity: 0.12;
    transition: r 0.5s cubic-bezier(.4,0,.2,1), opacity 0.5s ease;
  }

  .node-circle {
    stroke: var(--bg);
    stroke-width: 3px;
    transition: r 0.5s cubic-bezier(.4,0,.2,1);
  }

  .node-label {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 7px;
    font-weight: 600;
    text-anchor: middle;
    pointer-events: none;
  }

  /* ---- Legend ---- */
  #legend {
    flex: none;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr));
    gap: 6px 8px;
    padding: 8px 10px 12px;
    width: 100%;
    box-sizing: border-box;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    background: rgba(255,255,255,0.55);
    padding: 5px 10px;
    border-radius: 999px;
    min-width: 0;
    transition: background 0.25s ease, transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .legend-item:hover {
    background: rgba(255,255,255,0.85);
  }

  .legend-item:active {
    transform: scale(0.97);
  }

  .legend-item.active {
    background: rgba(255,255,255,0.95);
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }

  .legend-swatch {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex: none;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.6);
  }

  .legend-label {
    font-size: 10px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: 0.01em;
    line-height: 1.2;
    min-width: 0;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="chart-area"><svg id="viz"></svg></div>
  <div id="legend"></div>
</div>

<script>
const nodeDefs = [
  { id: "Computational Social Sciences", hex: "#B2C3A0" },
  { id: "Social Network Analysis",       hex: "#C3CBCA" },
  { id: "Economic Sociology",            hex: "#CF8D72" },
  { id: "Cultural Sociology",            hex: "#D8AF95" },
  { id: "Sociology of Elites",           hex: "#DFCA99" },
  { id: "Social & Cultural Theory",      hex: "#495D6D" }
];
const N = nodeDefs.length;

const nodes = nodeDefs.map((d, i) => Object.assign({ idx: i, x: 0, y: 0 }, d));

// fully-connected: every area of interest relates to the others
const links = [];
for (let i = 0; i < N; i++) {
  for (let j = i + 1; j < N; j++) {
    links.push({ source: nodes[i], target: nodes[j], a: i, b: j });
  }
}

const svg = d3.select("#viz");
const chartArea = document.getElementById("chart-area");
let width = chartArea.clientWidth;
let height = chartArea.clientHeight;

/* ---------- Choreography: a sequence of layout "formations" ---------- */

function cx() { return width / 2; }
function cy() { return height / 2; }

function fHexagon(rot) {
  const R = Math.min(width, height) * 0.27;
  const pts = [];
  for (let i = 0; i < N; i++) {
    const a = rot + (i / N) * Math.PI * 2;
    pts.push({ x: cx() + R * Math.cos(a), y: cy() + R * Math.sin(a) });
  }
  return { pts, centerIdx: -1 };
}

function fStar(centerIdx, rot) {
  // Guarantee every node (even the largest, "selected" state) stays fully
  // inside the chart area: R + maxOuterRadius must never exceed half the
  // smaller dimension, minus a small safety pad.
  const maxOuterRadius = BASE_HALO.selected * nodeScale();
  const safePad = 10;
  const R = Math.max(20, Math.min(width, height) / 2 - maxOuterRadius - safePad);
  const others = nodes.map((d, i) => i).filter(i => i !== centerIdx);
  const pts = new Array(N);
  pts[centerIdx] = { x: cx(), y: cy() };
  others.forEach((idx, k) => {
    const a = rot + (k / others.length) * Math.PI * 2;
    pts[idx] = { x: cx() + R * Math.cos(a), y: cy() + R * Math.sin(a) };
  });
  return { pts, centerIdx };
}

function fEllipse(rx, ry, rot) {
  const Rx = Math.min(width * 0.34, 460) * rx;
  const Ry = Math.min(height * 0.30, 340) * ry;
  const pts = [];
  for (let i = 0; i < N; i++) {
    const a = rot + (i / N) * Math.PI * 2;
    pts.push({ x: cx() + Rx * Math.cos(a), y: cy() + Ry * Math.sin(a) });
  }
  return { pts, centerIdx: -1 };
}

function fLine(rot) {
  const len = Math.min(width * 0.7, 760);
  const dx = Math.cos(rot), dy = Math.sin(rot);
  const pts = [];
  for (let i = 0; i < N; i++) {
    const t = (i / (N - 1) - 0.5) * len;
    pts.push({ x: cx() + dx * t, y: cy() + dy * t });
  }
  return { pts, centerIdx: -1 };
}

function fCluster(seed) {
  const R = Math.min(width, height) * 0.24;
  const pts = [];
  let s = seed;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2 + rnd() * 0.6;
    const r = R * (0.55 + rnd() * 0.7);
    pts.push({ x: cx() + r * Math.cos(a), y: cy() + r * Math.sin(a) * 0.85 });
  }
  return { pts, centerIdx: -1 };
}

const sequence = nodes.map((d, i) => () => fStar(i, Math.random() * Math.PI * 2));

let seqIndex = 0;
let targets = null;
let centerIdx = -1;
let selectedIdx = -1; // node enlarged via legend click

function applyFormation() {
  const { pts, centerIdx: c } = sequence[seqIndex]();
  targets = pts;
  centerIdx = c;
  updateHalos();
  updateLinkEmphasis();
  simulation.alpha(0.9).restart();
  seqIndex = (seqIndex + 1) % sequence.length;
}

/* ---------- Physics: gentle spring toward the current formation ---------- */

const simulation = d3.forceSimulation(nodes)
  .force("x", d3.forceX(d => targets ? targets[d.idx].x : cx()).strength(0.045))
  .force("y", d3.forceY(d => targets ? targets[d.idx].y : cy()).strength(0.045))
  .force("charge", d3.forceManyBody().strength(-160))
  .force("collision", d3.forceCollide().radius(56))
  .velocityDecay(0.28)
  .alphaDecay(0.03)
  .alphaMin(0.001)
  .alphaTarget(0); // settles to a full stop between formation changes

const g = svg.append("g");

const link = g.append("g")
  .selectAll("line")
  .data(links)
  .join("line")
  .attr("class", "link");

const nodeGroup = g.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", "node-group")
  .call(drag(simulation));

nodeGroup.append("circle")
  .attr("class", "node-halo")
  .attr("r", 36)
  .attr("stroke", d => d.hex);

nodeGroup.append("circle")
  .attr("class", "node-circle")
  .attr("r", 25)
  .attr("fill", d => d.hex);

function wrapLabel(text, maxWidth) {
  const words = text.split(" ");
  const lines = [];
  let current = "";
  words.forEach(w => {
    const test = current ? current + " " + w : w;
    if (test.length > maxWidth && current) {
      lines.push(current);
      current = w;
    } else {
      current = test;
    }
  });
  if (current) lines.push(current);
  return lines;
}

function textColorFor(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return lum > 0.6 ? "#23262B" : "#F6F3EC";
}

nodeGroup.each(function(d) {
  const lines = wrapLabel(d.id, 10);
  d.labelLines = lines;
  const textEl = d3.select(this).append("text")
    .attr("class", "node-label")
    .attr("fill", textColorFor(d.hex));
  lines.forEach((line, i) => {
    textEl.append("tspan")
      .attr("x", 0)
      .text(line);
  });
});

// Base (unscaled) radii for each node state; shrunk on small screens via nodeScale().
const BASE_R = { normal: 31, center: 40, selected: 57 };
const BASE_HALO = { normal: 44, center: 55, selected: 76 };
const BASE_COLLISION = 68;
const BASE_LABEL_FONT = 10;
const BASE_LINE_HEIGHT = 11;

function nodeScale() {
  return Math.max(0.55, Math.min(1, Math.min(width, height) / 420));
}

function updateHalos() {
  const s = nodeScale();
  nodeGroup.select(".node-circle")
    .attr("r", d => (d.idx === selectedIdx ? BASE_R.selected : (d.idx === centerIdx ? BASE_R.center : BASE_R.normal)) * s);
  nodeGroup.select(".node-halo")
    .attr("r", d => (d.idx === selectedIdx ? BASE_HALO.selected : (d.idx === centerIdx ? BASE_HALO.center : BASE_HALO.normal)) * s)
    .attr("opacity", d => d.idx === selectedIdx ? 0.26 : (d.idx === centerIdx ? 0.22 : 0.1));

  const fontSize = BASE_LABEL_FONT * s;
  const lineHeight = BASE_LINE_HEIGHT * s;
  nodeGroup.each(function(d) {
    const startY = -((d.labelLines.length - 1) * lineHeight) / 2 + fontSize * 0.36;
    d3.select(this).select(".node-label")
      .style("font-size", fontSize + "px")
      .selectAll("tspan")
      .attr("y", (_, i) => startY + i * lineHeight);
  });

  simulation.force("collision", d3.forceCollide().radius(BASE_COLLISION * s));
}

function updateLinkEmphasis() {
  link.classed("to-center", d =>
    (selectedIdx !== -1 && (d.a === selectedIdx || d.b === selectedIdx)) ||
    (selectedIdx === -1 && centerIdx !== -1 && (d.a === centerIdx || d.b === centerIdx))
  );
}

function currentOuterRadius(d) {
  const s = nodeScale();
  const state = d.idx === selectedIdx ? "selected" : (d.idx === centerIdx ? "center" : "normal");
  return BASE_HALO[state] * s;
}

simulation.on("tick", () => {
  // Hard safety net: regardless of formation math, transient physics
  // overshoot, or stale width/height, no node may ever render partially
  // outside the chart area.
  const pad = 4;
  nodes.forEach(d => {
    const rad = currentOuterRadius(d) + pad;
    const maxX = Math.max(rad, width - rad);
    const maxY = Math.max(rad, height - rad);
    d.x = Math.max(rad, Math.min(maxX, d.x));
    d.y = Math.max(rad, Math.min(maxY, d.y));
  });

  link
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x)
    .attr("y2", d => d.target.y);

  nodeGroup.attr("transform", d => `translate(${d.x},${d.y})`);
});

function drag(sim) {
  function dragstarted(event, d) {
    if (!event.active) sim.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
  }
  function dragged(event, d) {
    d.fx = event.x;
    d.fy = event.y;
  }
  function dragended(event, d) {
    if (!event.active) sim.alphaTarget(0);
    d.fx = null;
    d.fy = null;
  }
  return d3.drag()
    .on("start", dragstarted)
    .on("drag", dragged)
    .on("end", dragended);
}

/* ---------- Legend ---------- */

const legend = d3.select("#legend");
const legendItems = legend.selectAll(".legend-item")
  .data(nodes)
  .join("div")
  .attr("class", "legend-item")
  .on("click", (event, d) => {
    selectedIdx = (selectedIdx === d.idx) ? -1 : d.idx;
    legendItems.classed("active", n => n.idx === selectedIdx);
    updateHalos();
    updateLinkEmphasis();
  });

legendItems.append("div")
  .attr("class", "legend-swatch")
  .style("background", d => d.hex);

legendItems.append("div")
  .attr("class", "legend-label")
  .text(d => d.id);

function handleResize() {
  const w = chartArea.clientWidth;
  const h = chartArea.clientHeight;
  if (w === width && h === height) return;
  width = w;
  height = h;
  applyFormation();
}

window.addEventListener("resize", handleResize);
window.addEventListener("orientationchange", () => setTimeout(handleResize, 250));

if (window.ResizeObserver) {
  new ResizeObserver(handleResize).observe(chartArea);
}

(function seedInitial() {
  const { pts } = fCluster(17);
  nodes.forEach((d, i) => { d.x = pts[i].x; d.y = pts[i].y; });
})();

applyFormation();
setInterval(applyFormation, 5000);
</script>
</body>
</html>
